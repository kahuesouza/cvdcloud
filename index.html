    try{ OCULTOS = (cat && cat.ocultos && cat.ocultos.urls) ? cat.ocultos : await C.lerOcultos(); if(!OCULTOS.titulos) OCULTOS.titulos = {}; }catch(e){}
    prepararDados(); appIniciado = true; carregandoCatalogo = false; gateFechar(); render();
  }catch(e){
    carregandoCatalogo = false;
    if(C.admin()) gateMostrar(`<h1>Catálogo ainda não publicado</h1><p class="sub-g">Escolha o arquivo <b>catalogo-export.json</b> para publicar o catálogo no servidor protegido.</p>
      <div class="form"><label class="btn prim" style="cursor:pointer">Escolher arquivo<input type="file" accept="application/json,.json" data-importar hidden></label><p class="erro-f" id="imp-msg" role="status" style="color:var(--sub)"></p><button class="link-b" data-sair>Sair</button></div>`);
    else gateMostrar(`<h1>Catálogo indisponível</h1><p class="sub-g">O catálogo ainda não foi publicado. Fale com a administração do app.</p><div class="form"><button class="btn sec" data-sair>Sair</button></div>`);
  }
}
async function importarCatalogo(arquivo, msg){
  const C = CONTA(); const say = t => { if(msg) msg.textContent = t; };
  try{
    const j = JSON.parse(await arquivo.text());
    const chaves = ['dados', 'pontas', 'pontas_img', 'lupas', 'fotos', 'thumbs'];
    if(!j.dados || !j.dados.materiais || !j.dados.procedimentos) throw new Error('Arquivo inválido.');
    for(const k of chaves){ if(j[k] === undefined) continue; say('Publicando ' + k + '…'); await C.publicarCatalogo(k, JSON.stringify(j[k])); }
    say('Pronto! Catálogo publicado.'); toast('Catálogo publicado');
    setTimeout(() => location.reload(), 900);
  }catch(e){ say('Não foi possível publicar: ' + (e.message || 'erro')); }
}
function boot(){
  const C = CONTA();
  if(!C || !C.configurado){   // modo de preparação: ainda sem Firebase → app aberto
    carregarEstatico().then(() => { window.__origemCatalogo = 'arquivos'; prepararDados(); appIniciado = true; render(); })
      .catch(() => gateMostrar(`<h1>cvdcloud</h1><p class="sub-g">Não foi possível carregar o catálogo.</p>`));
    return;
  }
  if(C.ouvintes) C.ouvintes.add(atualizarGate);
  atualizarGate();
}

/* ===================== Roteador ===================== */
const NAV = [['#/','Início','casa','inicio'],['#/tipo/catalogo','Catálogos','livro','catalogo'],['#/procedimentos','Procedim.','dente','proc'],['#/pontas','Pontas','pilula','pontas'],['#/salvos','Salvos','estrela','salvos']];
const barEl = document.getElementById('bar'), app = document.getElementById('app'), navEl = document.getElementById('nav');
let io = null, rotaAnterior = '';

function qualNav(a, b){
  if(!a) return 'inicio';
  if(a==='tipo' && b==='catalogo') return 'catalogo';
  if(a==='procedimentos' || a==='topico') return 'proc';
  if(a==='pontas') return 'pontas';
  if(a==='salvos') return 'salvos';
  return '';
}
function escolherTela(){
  const [, a, b, c] = (location.hash || '#/').split('/');
  if(a==='produto') return telaProduto(b, c);
  if(a==='lupas') return telaLupas(b);
  if(a==='tipo') return telaTipo(b);
  if(a==='procedimentos') return telaProcedimentos(b);
  if(a==='topico') return telaTopico(b);
  if(a==='pontas') return telaPontas(b, c);
  if(a==='marketing') return telaMarketing();
  if(a==='marca') return telaMarca();
  if(a==='galeria') return telaGaleria(b);
  if(a==='salvos') return telaSalvos();
  if(a==='conta') return telaConta();
  if(a==='admin') return telaAdmin(b);
  if(a==='dicas') return telaConta();
  return telaInicio();
}
function pintar(){
  const h = location.hash || '#/', [, a, b] = h.split('/');
  const tela = escolherTela();
  const inicio = !!tela.inicio;
  barEl.innerHTML = `<div class="bar-linha">` + (tela.voltar ? `<a class="ibtn" href="${tela.voltar}" aria-label="Voltar">${ic('volta')}</a>` : `<a href="#/" aria-label="Início"><img class="logo" src="img/logo.svg" alt="cvdcloud"></a>`)
    + `<span class="titulo-pequeno">${inicio?'':esc(tela.titulo||'')}</span><span class="esp"></span>`
    + `<a class="ibtn" href="#/conta" aria-label="Minha conta" style="${CONTA() && CONTA().user ? 'color:var(--acento)' : ''}">${ic('usuario')}</a>`
    + `<button class="ibtn" data-tema aria-label="${temaEscuro()?'Usar visual branco':'Usar visual escuro'}">${ic(temaEscuro()?'sol':'lua')}</button></div>`
    + `<button class="busca-topo" data-busca aria-label="Buscar">${ic('busca')}<span>Buscar material, vídeo ou ponta</span></button>`;
  app.innerHTML = tela.corpo;
  const atual = qualNav(a, b);
  pintarAlertaContas(); atualizarNovas();
  navEl.innerHTML = NAV.map(([href,nome,icn,k])=>`<a href="${href}" class="${k===atual?'on':''}">${ic(icn)}${nome}</a>`).join('');
  const mesma = h.split('/').slice(0,3).join('/') === rotaAnterior.split('/').slice(0,3).join('/');
  const tabsMesmaPagina = h.split('/').slice(0,3).join('/') === rotaAnterior.split('/').slice(0,3).join('/');
  if(!tabsMesmaPagina || h.split('/').length < 4) { if(!mesma) window.scrollTo(0,0); }
  rotaAnterior = h;
  document.title = (tela.titulo && !inicio ? tela.titulo + ' · ' : '') + 'cvdcloud';
  track('tela', h.split('/').slice(1, 3).join('/') || 'inicio', tela.titulo || 'Início', '');
  if(io) io.disconnect();
  const g = app.querySelector('.largo');
  if(g && !inicio){ io = new IntersectionObserver(([en])=>barEl.classList.toggle('compacta', !en.isIntersecting), {rootMargin:'-56px 0px 0px 0px'}); io.observe(g); }
  else barEl.classList.remove('compacta');
  posicionarAbas();
  if(tela.depois) tela.depois();
}
function posicionarAbas(){
  const t = app.querySelector('.abas .trilho'); if(!t) return;
  const on = t.querySelector('a.on'), barra = t.querySelector('.barra'); if(!on||!barra) return;
  barra.style.width = on.offsetWidth + 'px'; barra.style.transform = `translateX(${on.offsetLeft}px)`;
  try{ on.scrollIntoView({inline:'center',block:'nearest'}); }catch(e){}
  requestAnimationFrame(()=>requestAnimationFrame(()=>barra.classList.remove('sem')));
}
function render(){
  if(!appIniciado) return;
  const Cx = CONTA(); if(Cx && Cx.configurado && Cx.estado() !== 'ok') return;
  let feito = false; const rodar = () => { if(feito) return; feito = true; pintar(); };
  if(document.startViewTransition && !reduzido && document.visibilityState === 'visible'){
    try{ document.startViewTransition(rodar); }catch(e){ rodar(); }
    setTimeout(rodar, 350);   // se a animação não rodar, troca a tela mesmo assim
  } else rodar();
}
window.addEventListener('hashchange', ()=>{ fecharPainel(); fecharBusca(); render(); });
window.addEventListener('resize', posicionarAbas);

/* ===================== Ações ===================== */
let tt; function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(()=>t.classList.remove('on'), 1900); }
async function enviarLink(titulo, link){
  let ok = false;
  try{ await navigator.clipboard.writeText(link); ok = true; }
  catch(e){
    try{ const ta = document.createElement('textarea'); ta.value = link; ta.setAttribute('readonly',''); ta.style.cssText = 'position:fixed;top:-100px;opacity:0'; document.body.appendChild(ta); ta.select(); ok = document.execCommand('copy'); ta.remove(); }catch(e2){}
  }
  toast(ok ? 'Link copiado' : 'Não foi possível copiar o link');
}
async function compartilhar(x){
  const nome = x.esp ? `${x.titulo}${x.prof?' · '+x.prof:''}` : x.titulo;
  const C = CONTA();
  track('compartilhar', chaveItem(x), x.titulo, '');
  // link rastreado: abre o material numa página do cvdcloud que registra (de forma anônima) o acesso do cliente
  if(C && C.configurado && C.aprovado()){
    try{
      const dl = linkDownload(x), t = THUMBS[x.url], tam = tamDownload(x);
      const id = await C.criarCompartilhamento({ titulo: nome, url: x.url, baixarUrl: dl || undefined, thumb: t ? 'img/t/' + t[0] : undefined, tipo: x.esp ? 'Vídeo de procedimento' : (TIPOS[x.tipo] || {}).nome, mb: typeof tam === 'number' ? tam : undefined });
      await enviarLink(nome, new URL('v.html', location.href.split('#')[0]).href + '#' + id);
    }catch(e){ toast('Não foi possível gerar o link agora'); }
    return;
  }
  await enviarLink(nome, x.url);   // modo de preparação (sem Firebase)
}

document.addEventListener('submit', async e => {

});
