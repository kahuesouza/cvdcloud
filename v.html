<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cvdcloud</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https:; media-src https:; connect-src https://*.googleapis.com https://*.firebaseio.com https://firestore.googleapis.com wss://*.firebaseio.com; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="img/icone.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbfbfd;--surface:#fff;--surface2:#f2f4f8;--linha:#e9ecf2;--texto:#0b1220;--sub:#667085;--fraco:#98a2b3;--acento:#3d72e6}
@media (prefers-color-scheme: dark){:root{--bg:#0b0f17;--surface:#121826;--surface2:#1a2233;--linha:#1f2a3e;--texto:#eef2f8;--sub:#9aa7bd;--fraco:#6d7a92;--acento:#6c97f5}.logo{filter:brightness(0) invert(1)}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 18px;background:var(--bg);color:var(--texto);font-family:"Montserrat",system-ui,sans-serif;font-weight:500;-webkit-font-smoothing:antialiased}
main{width:100%;max-width:440px}
.logo{height:34px;display:block;margin:0 auto 22px}
.cartao{background:var(--surface);border:1px solid var(--linha);border-radius:22px;padding:18px;box-shadow:0 8px 30px rgba(11,18,32,.06);animation:sobe .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes sobe{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.im{border-radius:16px;background:var(--surface2);overflow:hidden;display:grid;place-items:center;aspect-ratio:16/10;margin-bottom:16px}
.im img{width:100%;height:100%;object-fit:contain;display:block}
.im.doc img{object-fit:cover;object-position:top}
h1{font-size:28px;line-height:1.15;margin:0;font-weight:800;letter-spacing:-.01em;overflow-wrap:anywhere}
.meta{color:var(--sub);font-size:13px;margin:6px 0 0}
.botoes{display:grid;gap:10px;margin-top:20px}
a.btn{display:flex;align-items:center;justify-content:center;gap:9px;padding:15px 18px;border-radius:14px;font-weight:700;font-size:15px;text-decoration:none;transition:transform .15s}
a.btn:active{transform:scale(.97)}
.prim{background:var(--acento);color:#fff}.sec{background:var(--surface2);color:var(--texto)}
.rod{text-align:center;color:var(--fraco);font-size:12px;margin-top:22px}
.vazio{text-align:center;padding:30px 10px;color:var(--sub);line-height:1.6}
svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>
<body>
<main>
  <img class="logo" src="img/logo.svg" alt="cvdcloud">
  <div class="cartao" id="c"><div class="vazio">Carregando…</div></div>
  <div class="rod">Material compartilhado pela equipe CVDentus</div>
</main>
<script src="firebase-config.js"></script>
<script type="module">
const c = document.getElementById('c');
const esc = s => String(s ?? '').replace(/[&<>"']/g, x => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
const falha = m => { c.innerHTML = `<div class="vazio"><b>${m}</b><br>Peça um novo link a quem enviou.</div>`; };
const https = u => { try{ return new URL(u).protocol === 'https:'; }catch(e){ return false; } };
const id = (location.hash || '').slice(1);
const CFG = window.CVD_FIREBASE;
if(!/^[A-Za-z0-9]{10,40}$/.test(id)) falha('Link inválido.');
else if(!CFG || !CFG.apiKey) falha('Link indisponível.');
else {
  try{
    const V = '10.14.1';
    const [{ initializeApp }, { getFirestore, doc, getDoc }] = await Promise.all([
      import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`),
      import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`),
    ]);
    const db = getFirestore(initializeApp(CFG));
    const s = await getDoc(doc(db, 'compartilhamentos', id));
    if(!s.exists()) falha('Este link não existe mais.');
    else {
      const d = s.data();
      if(!https(d.url)) { falha('Link inválido.'); }
      else {
        const thumb = /^img\/[\w\-./]+$/.test(d.thumb || '') ? d.thumb : '';
        const mb = typeof d.mb === 'number' ? (d.mb < 1 ? '<1 MB' : (d.mb < 10 ? String(d.mb).replace('.', ',') : Math.round(d.mb)) + ' MB') : '';
        document.title = d.titulo + ' · cvdcloud';
        const ehVideo = /\.mp4(\?|$)/i.test(d.url);
        c.innerHTML = `${ehVideo ? `<div class="im" style="aspect-ratio:auto;background:#000"><video controls playsinline preload="metadata" ${thumb ? `poster="${esc(thumb)}"` : ''} src="${esc(d.url)}" style="width:100%;max-height:60vh;display:block"></video></div>` : thumb ? `<div class="im ${/\/t\//.test(thumb) ? 'doc' : ''}"><img alt="" src="${esc(thumb)}"></div>` : ''}
          <h1>${esc(d.titulo)}</h1><p class="meta">${esc([d.tipo, mb].filter(Boolean).join(' · '))}</p>
          <div class="botoes">${ehVideo ? '' : `<a class="btn prim" href="${esc(d.url)}" target="_blank" rel="noopener noreferrer">Abrir</a>`}
          ${d.baixarUrl && https(d.baixarUrl) ? `<a class="btn ${ehVideo ? 'prim' : 'sec'}" href="${esc(d.baixarUrl)}" download rel="noopener noreferrer"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 20h16"/></svg>Baixar${mb ? ' · ' + esc(mb) : ''}</a>` : ''}</div>`;
      }
    }
  }catch(e){ falha('Não foi possível abrir este link agora.'); }
}
</script>
</body>
</html>
