<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cvdcloud</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https:; media-src https:; frame-src 'self' https://www.youtube-nocookie.com; connect-src https://*.googleapis.com https://*.firebaseio.com https://firestore.googleapis.com wss://*.firebaseio.com; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#000000">
<link rel="icon" href="img/icone.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#ffffff;--surface:#ffffff;--surface2:#f4f4f5;--linha:#e4e4e7;--texto:#09090b;--sub:#52525b;--fraco:#8a8a93}
@media (prefers-color-scheme: dark){:root{--bg:#000000;--surface:#0b0b0c;--surface2:#151517;--linha:#222225;--texto:#fafafa;--sub:#a1a1aa;--fraco:#71717a}.logo{filter:brightness(0) invert(1)}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:22px 16px 40px;background:var(--bg);color:var(--texto);font-family:"Montserrat",system-ui,sans-serif;font-weight:500;-webkit-font-smoothing:antialiased}
main{width:100%;max-width:560px;margin:0 auto}
.logo{height:22px;display:block;margin:6px 0 24px}
.cartao{animation:sobe .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes sobe{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.midia{border-radius:18px;overflow:hidden;background:var(--surface2);border:1px solid var(--linha);margin-bottom:18px}
.midia video,.midia img{display:block;width:100%;max-height:70vh;object-fit:contain;background:#000}
.midia.img-clara img{background:var(--surface2)}
.midia iframe{display:block;width:100%;border:0;aspect-ratio:16/9;background:#000}
.midia iframe.pdf{aspect-ratio:auto;height:72vh;background:#fff}
.midia.capa img{object-fit:cover;object-position:top;max-height:340px}
h1{font-size:26px;line-height:1.15;margin:0;font-weight:800;letter-spacing:-.03em;overflow-wrap:anywhere}
.meta{color:var(--sub);font-size:13px;margin:8px 0 0}
.botoes{display:grid;gap:10px;margin-top:20px}
a.btn{display:flex;align-items:center;justify-content:center;gap:9px;padding:15px 18px;border-radius:14px;font-weight:700;font-size:15px;text-decoration:none;transition:transform .15s}
a.btn:active{transform:scale(.97)}
.prim{background:var(--texto);color:var(--bg)}.sec{background:var(--surface2);color:var(--texto);border:1px solid var(--linha)}
.rod{text-align:center;color:var(--fraco);font-size:12px;margin-top:26px}
.vazio{text-align:center;padding:40px 10px;color:var(--sub);line-height:1.6}
svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ficha h2{font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;margin:26px 0 10px;color:var(--texto)}
.ficha .sub{color:var(--sub);font-size:14.5px;line-height:1.6;margin:10px 0 0}
.ficha .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.ficha .chip{font-size:12px;font-weight:700;padding:6px 11px;border-radius:999px;border:1px solid var(--linha);background:var(--surface2);color:var(--texto)}
.ficha .bloco{border:1px solid var(--linha);border-radius:16px;padding:16px;margin-top:10px;background:var(--surface)}
.ficha .bloco b.t{display:block;font-size:13px;margin-bottom:8px}
.ficha ul{list-style:none;margin:0;padding:0}
.ficha li{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-top:1px solid var(--linha);font-size:14px;line-height:1.4}
.ficha li:first-child{border-top:0}
.ficha li span.p{flex:none;color:var(--sub);font-weight:700;font-size:12.5px}
.ficha .grade{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ficha .foto{border:1px solid var(--linha);border-radius:14px;overflow:hidden;background:#fff}
.ficha .foto img{display:block;width:100%;aspect-ratio:1;object-fit:contain}
.ficha .foto a{display:block;text-align:center;padding:9px;font-size:12.5px;font-weight:700;color:var(--texto);text-decoration:none;background:var(--surface2);border-top:1px solid var(--linha)}
.ficha .carro{position:relative;margin-bottom:6px}
.ficha .faixa{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;border-radius:18px}
.ficha .faixa::-webkit-scrollbar{display:none}
.ficha .sl{flex:0 0 100%;scroll-snap-align:center;position:relative;background:#fff;border:1px solid var(--linha);border-radius:18px;overflow:hidden}
.ficha .sl img{display:block;width:100%;aspect-ratio:1;object-fit:contain}
.ficha .sl em{position:absolute;left:12px;bottom:12px;font-style:normal;font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;background:#000b;color:#fff}
.ficha .seta{position:absolute;top:50%;width:40px;height:40px;margin-top:-20px;border-radius:50%;border:1px solid var(--linha);background:var(--surface);color:var(--texto);display:grid;place-items:center;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.18);padding:0}
.ficha .seta.e{left:8px}.ficha .seta.d{right:8px}
.ficha .seta[hidden]{display:none}
.ficha .pts{display:flex;justify-content:center;gap:7px;margin-top:12px}
.ficha .pts i{width:7px;height:7px;border-radius:50%;background:var(--linha);transition:all .2s}
.ficha .pts i.on{width:22px;border-radius:4px;background:var(--texto)}
.ficha .dica{color:var(--fraco);font-size:12.5px;text-align:center;margin:8px 0 0}
.ficha .baixar{display:grid;gap:8px;margin-top:8px}
.ficha .baixar a{display:flex;align-items:center;justify-content:center;gap:9px;padding:13px 16px;border-radius:12px;border:1px solid var(--linha);background:var(--surface2);color:var(--texto);font-weight:700;font-size:14px;text-decoration:none}
.ficha .vid{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:10px;border:1px solid var(--linha);border-radius:14px;background:var(--surface);margin-top:8px;font:inherit;color:inherit;cursor:pointer}
.ficha .vid img{width:96px;height:54px;object-fit:cover;border-radius:8px;background:#000;flex:none}
.ficha .vid span{font-weight:700;font-size:14px;line-height:1.3}
.ficha .vid small{display:block;color:var(--fraco);font-weight:600;font-size:12px;margin-top:2px}
.ficha .doc{margin-top:8px}
.aviso{position:fixed;left:12px;right:12px;bottom:12px;max-width:536px;margin:0 auto;padding:14px 16px;border-radius:16px;background:var(--surface);border:1px solid var(--linha);box-shadow:0 12px 40px rgba(0,0,0,.25);font-size:12.5px;line-height:1.5;color:var(--sub);z-index:5}
.aviso b{color:var(--texto)}
.aviso .ac{display:flex;gap:14px;margin-top:10px;align-items:center}
.aviso button{font:inherit;font-weight:700;font-size:13px;border:0;border-radius:10px;padding:9px 16px;cursor:pointer;background:var(--texto);color:var(--bg)}
.aviso button.sec2{background:var(--surface2);color:var(--texto);border:1px solid var(--linha)}
.aviso a{color:var(--sub);font-size:12px;text-decoration:underline;cursor:pointer}
</style>
</head>
<body>
<main>
  <img class="logo" src="img/logo.svg" alt="cvdcloud">
  <div class="cartao" id="c"><div class="vazio">Carregando…</div></div>
  <div class="rod">Material compartilhado pela equipe CVDentus</div>
</main>
<div id="aviso" class="aviso" hidden></div>
<script src="firebase-config.js"></script>
<script type="module">
const c = document.getElementById('c');
const esc = s => String(s ?? '').replace(/[&<>"']/g, x => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
const falha = m => { c.innerHTML = `<div class="vazio"><b>${m}</b><br>Peça um novo link a quem enviou.</div>`; };
const https = u => { try{ return new URL(u).protocol === 'https:'; }catch(e){ return false; } };
const id = (location.hash || '').slice(1);
const CFG = window.CVD_FIREBASE;

/* ---------- cookie de visitante (anônimo, do próprio site) ---------- */
const lerCookie = n => { const m = document.cookie.match(new RegExp('(?:^|; )' + n + '=([^;]*)')); return m ? decodeURIComponent(m[1]) : null; };
const gravarCookie = (n, v, dias) => { try{ document.cookie = `${n}=${encodeURIComponent(v)}; max-age=${dias * 86400}; path=/; SameSite=Lax${location.protocol === 'https:' ? '; Secure' : ''}`; }catch(e){} };
const aleatorio = n => { const a = new Uint8Array(n); crypto.getRandomValues(a); return Array.from(a, x => 'abcdefghijklmnopqrstuvwxyz0123456789'[x % 36]).join(''); };
function aparelho(){
  const ua = navigator.userAgent, m = /Mobi|Android|iPhone/i.test(ua), t = /iPad|Tablet/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  const so = /Android/i.test(ua) ? 'Android' : /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1) ? 'iOS' : /Windows/i.test(ua) ? 'Windows' : /Mac OS/i.test(ua) ? 'macOS' : /Linux/i.test(ua) ? 'Linux' : 'outro';
  const nav = /SamsungBrowser/i.test(ua) ? 'Samsung' : /Edg\//i.test(ua) ? 'Edge' : /OPR\//i.test(ua) ? 'Opera' : /Firefox/i.test(ua) ? 'Firefox' : /Chrome|CriOS/i.test(ua) ? 'Chrome' : /Safari/i.test(ua) ? 'Safari' : 'outro';
  return { disp: t ? 'tablet' : m ? 'celular' : 'computador', so, nav };
}


/* ---------- fichas: o cliente vê a informação aqui, sem ser levado para o site ---------- */
const carregarScript = src => new Promise((ok, er) => { const t = document.createElement('script'); t.src = src; t.onload = ok; t.onerror = () => er(new Error(src)); document.head.appendChild(t); });
const expandirCod = c => { const m = c.match(/^(\S+) · Ø (.+)$/); return m ? m[2].split('/').map(dd => m[1] + ' ' + dd) : [c.replace(/\s*\(.*?\)/g, '').trim()]; };
const fmtPot = p => !p ? '' : /^\d+$/.test(p) ? 'Pot. ' + p : p;
const ehSiteEmpresa = u => { try{ const h = new URL(u).hostname; return /(^|\.)cvdentus\.com\.br$/.test(h) && h !== 'cloud.cvdentus.com.br'; }catch(e){ return false; } };
function fichaDe(d){
  try{
    const U = new URL(d.url);
    const f = U.searchParams.get('ficha');
    if(/\/v\.html$/.test(U.pathname) && f === 'ponta') return { t: 'ponta', c: U.searchParams.get('c') || '', e: U.searchParams.get('e') || '' };
    if(/\/v\.html$/.test(U.pathname) && f === 'equip') return { t: 'equip', p: U.searchParams.get('p') || '' };
    if(ehSiteEmpresa(d.url)){                       // links antigos que levavam ao site
      if(/\/produto\/ponta-/.test(U.pathname)) return { t: 'ponta', link: d.url };
      if(/spray-control/.test(U.pathname)) return { t: 'equip', p: 'spray-control' };
      if(/linha-elo/.test(U.pathname)) return { t: 'equip', p: 'linha-elo' };
      if(/bula-piezos/.test(U.pathname)) return { t: 'equip', p: 'pontas' };
    }
  }catch(e){}
  return null;
}
async function renderFicha(f, d){
  const W = window;
  if(f.t === 'ponta'){
    await Promise.all([carregarScript('pontas.js'), carregarScript('pontas_img.js')]);
    const IMGP = W.CVD_PONTAS_IMG || {}, PREV = W.CVD_PONTAS_PREV, DL = W.CVD_PONTAS_DL;
    let key = f.c;
    if(!key && f.link){ const norm = x => String(x).replace(/\/+$/, ''); key = Object.keys(IMGP).find(k => norm(IMGP[k].link) === norm(f.link)) || ''; }
    const I = IMGP[key];
    if(!I){ c.innerHTML = `<h1>${esc(d.titulo)}</h1><p class="meta">Conteúdo apresentado pela equipe CVDentus.</p>`; return; }
    const usos = [];
    (W.CVD_PONTAS || []).forEach(e => { if(f.e && e.id !== f.e) return; e.modos.forEach(m => m.pontas.forEach(p => { if(p.cod.flatMap(expandirCod).includes(key)) usos.push({ eq: e.nome, modo: m.nome, linhas: p.linhas }); })); });
    if(f.e && !usos.length) (W.CVD_PONTAS || []).forEach(e => e.modos.forEach(m => m.pontas.forEach(p => { if(p.cod.flatMap(expandirCod).includes(key)) usos.push({ eq: e.nome, modo: m.nome, linhas: p.linhas }); })));   // aparelho sem essa ponta: mostra todos
    const eqs = [...new Set(usos.map(u => u.eq))];
    document.title = 'Ponta ' + key + ' · cvdcloud';
    const foto0 = I.f[0];
    c.innerHTML = `<div class="ficha">
      <div class="carro"><div class="faixa" id="fx">${I.f.map(([id, rot]) => `<div class="sl"><img ${id === foto0[0] ? '' : 'loading="lazy" '}alt="${esc(rot)} da ponta ${esc(key)}" src="${esc(PREV + id + '.webp')}"><em>${esc(rot)}</em></div>`).join('')}</div>
        ${I.f.length > 1 ? `<button class="seta e" id="se" aria-label="Imagem anterior" hidden><svg viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></svg></button><button class="seta d" id="sd" aria-label="Próxima imagem"><svg viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg></button>` : ''}
      </div>
      ${I.f.length > 1 ? `<div class="pts" id="pts">${I.f.map((_, i) => `<i class="${i ? '' : 'on'}"></i>`).join('')}</div><p class="dica">Deslize para o lado para ver todas as imagens</p>` : ''}
      <h1>Ponta ${esc(key)}</h1>
      ${f.e && eqs.length === 1 ? `<p class="sub">Indicações no ${esc(eqs[0])}</p>` : ''}
      ${eqs.length ? `<div class="chips">${eqs.map(e => `<span class="chip">${esc(e)}</span>`).join('')}</div>` : ''}
      ${usos.length ? `<h2>Indicações</h2>` + usos.map(u => `<div class="bloco"><b class="t">${esc(u.eq)} · ${esc(u.modo)}</b><ul>${u.linhas.map(([ind, pot]) => `<li><span>${esc(ind)}</span>${pot ? `<span class="p">${esc(fmtPot(pot))}</span>` : ''}</li>`).join('')}</ul></div>`).join('') : ''}
      <h2>Baixar imagens</h2>
      <div class="baixar">${I.f.map(([id, rot]) => `<a href="${esc(DL + id + '.png')}" download data-baixou><svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 20h16"/></svg>Baixar PNG · ${esc(rot)}</a>`).join('')}</div>
    </div>`;
    const fx = document.getElementById('fx'), pts = [...document.querySelectorAll('#pts i')], se = document.getElementById('se'), sd = document.getElementById('sd');
    if(fx && pts.length){
      const idx = () => Math.round(fx.scrollLeft / (fx.clientWidth + 10));
      const atualizar = () => { const i = Math.max(0, Math.min(pts.length - 1, idx())); pts.forEach((p, k) => p.classList.toggle('on', k === i)); if(se) se.hidden = i === 0; if(sd) sd.hidden = i === pts.length - 1; };
      fx.addEventListener('scroll', atualizar, { passive: true });
      const ir = d => fx.scrollTo({ left: (idx() + d) * (fx.clientWidth + 10), behavior: 'smooth' });
      se && se.addEventListener('click', () => ir(-1)); sd && sd.addEventListener('click', () => ir(1));
      let vistas = new Set(); fx.addEventListener('scroll', () => { vistas.add(idx()); if(vistas.size > 1) document.getElementById('c').dispatchEvent(new CustomEvent('ficha-interacao')); }, { passive: true });
    }
    return;
  }
  // equipamento
  await Promise.all([carregarScript('dados.js'), carregarScript('fotos.js')]);
  const D = W.CVD, P = (D.produtos || []).find(x => x.id === f.p);
  if(!P){ c.innerHTML = `<h1>${esc(d.titulo)}</h1><p class="meta">Conteúdo apresentado pela equipe CVDentus.</p>`; return; }
  document.title = P.nome + ' · cvdcloud';
  const ptb = m => !m.idioma || m.idioma === 'pt';
  const yid = u => ((u || '').match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([\w-]{11})/) || [])[1];
  const videos = (D.materiais || []).filter(m => m.produto === f.p && ptb(m) && (yid(m.url) || /\.mp4(\?|$)/i.test(m.url || ''))).slice(0, 12);
  const docs = (D.materiais || []).filter(m => m.produto === f.p && ptb(m) && /\.pdf(\?|$)/i.test(m.url || '') && /^https:/.test(m.url) && !ehSiteEmpresa(m.url));
  const FO = (W.CVD_FOTOS && W.CVD_FOTOS.equip && W.CVD_FOTOS.equip[f.p]) || null;
  const fotos = FO ? FO.grupos.flatMap(g => g.itens).slice(0, 6) : [];
  c.innerHTML = `<div class="ficha">
    ${P.img ? `<div class="midia img-clara"><img alt="${esc(P.nome)}" src="${esc(P.img)}"></div>` : ''}
    <div class="midia" id="pl" hidden></div>
    <h1>${esc(P.nome)}</h1>
    ${P.resumo ? `<p class="sub">${esc(P.resumo)}</p>` : ''}
    ${P.nota ? `<div class="bloco"><span class="p">${esc(P.nota)}</span></div>` : ''}
    ${videos.length ? `<h2>Vídeos</h2>` + videos.map((m, i) => { const y = yid(m.url); return `<button class="vid" data-vid="${i}"><img loading="lazy" alt="" src="${y ? 'https://i.ytimg.com/vi/' + y + '/mqdefault.jpg' : (m.thumb || '')}" onerror="this.style.visibility='hidden'"><span>${esc(m.titulo)}<small>${y ? 'Vídeo' : 'Vídeo' + (m.mb ? ' · ' + Math.round(m.mb) + ' MB' : '')}</small></span></button>`; }).join('') : ''}
    ${fotos.length ? `<h2>Fotos</h2><div class="grade">${fotos.map(it => `<div class="foto"><img loading="lazy" alt="${esc(it.titulo)}" src="${esc(W.CVD_FOTOS.prev + it.id + '.webp')}"><a href="${esc(W.CVD_FOTOS.dl + it.id + '.' + it.ext)}" download data-baixou>Baixar · ${esc(it.titulo)}</a></div>`).join('')}</div>` : ''}
    ${docs.length ? `<h2>Catálogos e manuais</h2>` + docs.map(m => `<a class="btn sec doc" href="${esc(m.url)}" target="_blank" rel="noopener noreferrer" data-marca>${esc(m.titulo)}</a>`).join('') : ''}
  </div>`;
  c.querySelectorAll('[data-vid]').forEach(b => b.addEventListener('click', () => {
    const m = videos[+b.dataset.vid], y = yid(m.url), pl = document.getElementById('pl');
    pl.innerHTML = y ? `<iframe src="https://www.youtube-nocookie.com/embed/${y}?rel=0&playsinline=1&autoplay=1" title="${esc(m.titulo)}" allow="accelerometer; autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>` : `<video controls autoplay playsinline src="${esc(m.url)}"></video>`;
    pl.hidden = false; pl.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }));
}

if(!/^[A-Za-z0-9]{10,40}$/.test(id)) falha('Link inválido.');
else if(!CFG || !CFG.apiKey) falha('Link indisponível.');
else {
  try{
    const V = '10.14.1';
    const [{ initializeApp }, { getFirestore, doc, getDoc, setDoc, updateDoc, serverTimestamp }] = await Promise.all([
      import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`),
      import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`),
    ]);
    const db = getFirestore(initializeApp(CFG));
    const s = await getDoc(doc(db, 'compartilhamentos', id));
    if(!s.exists()) { falha('Este link não existe mais.'); }
    else {
      const d = s.data();
      if(!https(d.url)) { falha('Link inválido.'); }
      else {
        const thumb = /^img\/[\w\-./]+$/.test(d.thumb || '') ? d.thumb : '';
        const mb = typeof d.mb === 'number' ? (d.mb < 1 ? '<1 MB' : (d.mb < 10 ? String(d.mb).replace('.', ',') : Math.round(d.mb)) + ' MB') : '';
        document.title = d.titulo + ' · cvdcloud';
        const fic = fichaDe(d);
        if(fic){ await renderFicha(fic, d); }
        else {
        const u = d.url, mesma = u.startsWith(location.origin + '/');
        const yt = (u.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([\w-]{11})/) || [])[1];
        const ehMp4 = /\.mp4(\?|$)/i.test(u), ehPdf = /\.pdf(\?|$)/i.test(u), ehImg = /\.(png|jpe?g|webp|gif)(\?|$)/i.test(u);
        const celular = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);
        let midia = '';
        if(yt) midia = `<div class="midia"><iframe id="yt" src="https://www.youtube-nocookie.com/embed/${yt}?rel=0&playsinline=1" title="${esc(d.titulo)}" allow="accelerometer; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe></div>`;
        else if(ehMp4) midia = `<div class="midia"><video id="vd" controls playsinline preload="metadata" ${thumb ? `poster="${esc(thumb)}"` : ''} src="${esc(u)}"></video></div>`;
        else if(ehImg) midia = `<div class="midia img-clara"><img alt="${esc(d.titulo)}" src="${esc(u)}"></div>`;
        else if(ehPdf && mesma && !celular) midia = `<div class="midia"><iframe class="pdf" id="pdf" src="${esc(u)}#view=FitH" title="${esc(d.titulo)}"></iframe></div>`;
        else if(thumb) midia = `<div class="midia capa"><img alt="" src="${esc(thumb)}"></div>`;
        const siteEmpresa = ehSiteEmpresa(u);
        const mostraAbrir = !(yt || ehMp4 || ehImg || (ehPdf && mesma && !celular) || siteEmpresa);
        const dlOk = d.baixarUrl && https(d.baixarUrl);
        c.innerHTML = `${midia}<h1>${esc(d.titulo)}</h1><p class="meta">${esc([d.tipo, mb].filter(Boolean).join(' · '))}</p>${siteEmpresa && !dlOk ? '<p class="meta">Conteúdo apresentado pela equipe CVDentus. Fale com o seu consultor para saber mais.</p>' : ''}
          <div class="botoes">${mostraAbrir || (ehPdf && celular) ? `<a class="btn prim" id="b-abrir" href="${esc(u)}" target="_blank" rel="noopener noreferrer">${ehPdf ? 'Abrir o PDF' : 'Abrir'}</a>` : ''}
          ${dlOk ? `<a class="btn ${mostraAbrir ? 'sec' : 'prim'}" id="b-baixar" href="${esc(d.baixarUrl)}" download rel="noopener noreferrer"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 20h16"/></svg>Baixar${mb ? ' · ' + esc(mb) : ''}</a>` : ''}</div>`;

        }

        /* ---------- registro do acesso, SÓ depois que o visitante aceita ---------- */
        const depuracao = /[?&]debug=1/.test(location.search);
        const nota = t => { if(!depuracao) return; let el = document.getElementById('dbg'); if(!el){ el = document.createElement('pre'); el.id = 'dbg'; el.style.cssText = 'margin:18px 0 0;font:12px/1.5 monospace;white-space:pre-wrap;color:var(--sub)'; document.querySelector('main').appendChild(el); } el.textContent += t + '\n'; };
        let rastreando = false;
        const iniciarRastreio = () => {
          if(rastreando) return; rastreando = true;
          const jaTinha = !!lerCookie('cvdcloud_v');
          const vid = lerCookie('cvdcloud_v') || aleatorio(20);
          gravarCookie('cvdcloud_v', vid, 400);
          const ap = aparelho(), sid = aleatorio(20);
          let ref = ''; try{ ref = document.referrer ? new URL(document.referrer).hostname.slice(0, 60) : ''; }catch(e){}
          const estado = { seg: 0, abriu: false, baixou: false, video: 0 };
          const ref_ = doc(db, 'visitas', sid);
          const base = { compId: id, vid, retorno: jaTinha, disp: ap.disp, so: ap.so, nav: ap.nav, tz: (Intl.DateTimeFormat().resolvedOptions().timeZone || '').slice(0, 40), idioma: (navigator.language || '').slice(0, 12), tela: `${screen.width}x${screen.height}`.slice(0, 12), ref };
          let criado = false;
          const criar = () => setDoc(ref_, { ...base, ...estado, criadoEm: serverTimestamp(), ultimoSinal: serverTimestamp() })
            .then(() => { criado = true; nota('registro de acesso: ok'); })
            .catch(e => { nota('registro de acesso: ERRO ' + (e && e.code || e) + (e && e.code === 'permission-denied' ? ' (as regras do Firestore v8 ainda não foram publicadas?)' : '')); });
          criar();
          let sujo = false, ultimo = Date.now(), visivel = document.visibilityState === 'visible';
          const enviar = () => { if(!sujo || !criado) return; sujo = false; updateDoc(ref_, { seg: estado.seg, abriu: estado.abriu, baixou: estado.baixou, video: Math.round(estado.video), ultimoSinal: serverTimestamp() }).catch(e => nota('atualização: ERRO ' + (e && e.code || e))); };
          setInterval(() => { const agora = Date.now(); if(visivel && estado.seg < 7200){ estado.seg += Math.min(6, Math.round((agora - ultimo) / 1000)); sujo = true; } ultimo = agora; if(!criado && !criar.tentou){ criar.tentou = true; criar(); } enviar(); }, 5000);
          document.addEventListener('visibilitychange', () => { visivel = document.visibilityState === 'visible'; ultimo = Date.now(); if(!visivel){ sujo = true; enviar(); } });
          addEventListener('pagehide', () => { sujo = true; enviar(); });
          const marca = campo => { if(!estado[campo]){ estado[campo] = true; sujo = true; enviar(); } };
          document.getElementById('b-abrir')?.addEventListener('click', () => marca('abriu'));
          c.addEventListener('ficha-interacao', () => marca('abriu'));
          c.addEventListener('click', e => { if(e.target.closest('[data-vid],[data-marca],.seta')) marca('abriu'); if(e.target.closest('[data-baixou]')) marca('baixou'); });
          document.getElementById('b-baixar')?.addEventListener('click', () => marca('baixou'));
          const v = document.getElementById('vd');
          if(v){ let ult = 0; v.addEventListener('play', () => marca('abriu')); v.addEventListener('timeupdate', () => { if(!v.paused && v.currentTime > ult && v.currentTime - ult < 2) { estado.video += v.currentTime - ult; sujo = true; } ult = v.currentTime; }); v.addEventListener('seeked', () => { ult = v.currentTime; }); }
          document.getElementById('pdf') && marca('abriu');
          document.getElementById('yt') && marca('abriu');
        };
        const decisao = lerCookie('cvdcloud_ciente');          // '1' aceitou · '0' recusou
        if(navigator.doNotTrack === '1' || decisao === '0'){ nota('rastreio desligado (recusado ou "não rastrear" do navegador)'); }
        else if(decisao === '1'){ iniciarRastreio(); }
        else {
          const av = document.getElementById('aviso');
          av.innerHTML = `<b>Posso registrar seu acesso?</b> Para a CVDentus entender o que interessa aos clientes, registramos de forma <b>anônima</b> o horário, o tipo de aparelho e o tempo que você fica nesta página. <b>Não</b> pedimos nome, telefone nem e-mail, e você pode recusar sem perder nada.
            <div class="ac"><button id="aceitar">Aceitar</button><button id="recusar" class="sec2">Recusar</button></div>`;
          av.hidden = false;
          document.getElementById('aceitar').onclick = () => { gravarCookie('cvdcloud_ciente', '1', 400); av.hidden = true; iniciarRastreio(); };
          document.getElementById('recusar').onclick = () => { gravarCookie('cvdcloud_ciente', '0', 400); gravarCookie('cvdcloud_v', '', 0); av.hidden = true; nota('rastreio recusado'); };
        }
      }
    }
  }catch(e){ falha('Não foi possível abrir este link agora.'); }
}
</script>
</body>
</html>
